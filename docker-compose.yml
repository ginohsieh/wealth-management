version: '3.8'

services:
  backend:
    build: ./backend
    container_name: wm-backend
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: wm-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

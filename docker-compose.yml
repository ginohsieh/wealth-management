version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: wm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:-wealthdb}
      POSTGRES_USER:     ${DB_USER:-wealthuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-wealthpass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT_EXTERNAL:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-wealthuser} -d ${DB_NAME:-wealthdb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: wm-backend
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST:     postgres
      DB_PORT:     5432
      DB_NAME:     ${DB_NAME:-wealthdb}
      DB_USER:     ${DB_USER:-wealthuser}
      DB_PASSWORD: ${DB_PASSWORD:-wealthpass}
      DB_SSLMODE:  ${DB_SSLMODE:-disable}

  frontend:
    build: ./frontend
    container_name: wm-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
